# CMVP-01 minimal production deployment blueprint for Render
# (https://render.com/docs/blueprint-spec). Declares build/start commands
# and the required environment shape only -- it does not provision a
# database (DATABASE_URL is left for manual entry, `sync: false`, so no
# Postgres instance is auto-created by importing this blueprint) and it
# does not embed any secret value. Import this file from the Render
# dashboard ("New +" -> "Blueprint") pointed at this repository; Render
# will prompt for every `sync: false` value before the first deploy.
#
# Startup runs `alembic upgrade head` before `uvicorn` on every deploy,
# matching this repo's documented convention that schema changes are
# Alembic-managed only (see README.md "Local setup") -- appropriate for a
# single-instance pilot deployment. If this service is ever scaled to
# multiple concurrent instances, migrations should be moved to Render's
# `preDeployCommand` (run once per deploy, not per instance) instead.
services:
  - type: web
    name: intel4ops-core-api
    runtime: python
    plan: starter
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        # Pinned to the exact Python line this repo is certified against
        # (999+/1121+ passing tests, mypy, Ruff all run under CPython
        # 3.12.x locally). Render defaults new Python services to whatever
        # its current latest runtime is (3.14 at the time of writing),
        # which this project has never been tested or certified against.
        value: 3.12.13
      - key: APP_ENV
        # Prompted rather than hard-coded so the same blueprint can deploy
        # either a real production instance (APP_ENV=production, pilot auth
        # vars below left unset) or a temporary pilot instance
        # (APP_ENV=pilot, or any non-"production" value, with the pilot
        # auth vars below configured). Pilot auth is hard-disabled whenever
        # this is exactly "production" -- see app/auth/pilot_bridge.py.
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        # Comma-separated explicit origin allowlist (no wildcard). Includes
        # the deployed IntelOps Navigator frontend (P3.xxA.2) alongside the
        # existing intel4ops.com origin.
        value: https://app.intel4ops.com,https://intelops-navigator.lovable.app
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_JWKS_URL
        sync: false
      - key: OIDC_ALLOWED_ALGORITHMS
        # Supabase Auth (the live provider as of SBASE-03) signs with
        # ES256, not the Auth0-era RS256 this blueprint originally shipped
        # with -- see docs/architecture/parking-lot/auth0-render-cmvp01.md.
        value: ES256
      # ------------------------------------------------------------------
      # P3.xxA.2 pilot auth bridge -- temporary. Leave ALL four unset for a
      # real production deployment (APP_ENV=production already disables
      # this bridge unconditionally, but leaving these blank too avoids any
      # ambiguity). Only set them for a non-production pilot instance:
      #   PILOT_AUTH_ENABLED=true
      #   PILOT_AUTH_TOKEN=<a generated secret, not a guessable string>
      #   PILOT_USER_ID=<a fixed UUID for the pilot operator identity>
      #   PILOT_PLATFORM_ADMIN=true   (only if the pilot identity needs to
      #                                 create/list organizations)
      # PILOT_AUTH_TOKEN is an operator-held bootstrap credential ONLY. It
      # must never be placed in a VITE_* variable, the Navigator/Lovable
      # frontend source, a JS bundle, localStorage, or any other
      # browser-visible configuration. See README.md "Recommended pilot
      # security model" for the bootstrap-once-then-normal-auth flow, and
      # app/auth/pilot_bridge.py for full activation rules.
      # ------------------------------------------------------------------
      - key: PILOT_AUTH_ENABLED
        sync: false
      - key: PILOT_AUTH_TOKEN
        sync: false
      - key: PILOT_USER_ID
        sync: false
      - key: PILOT_PLATFORM_ADMIN
        sync: false
