name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff, Mypy, Pytest, and Alembic
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: intel4ops_ci_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intel4ops_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/intel4ops_ci_test
      CONFIRM_DISPOSABLE_POSTGRES: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy .

      - name: Run SQLite and application tests
        run: python -m pytest -m "not postgres"

      - name: Run disposable PostgreSQL tests
        run: python -m pytest -m postgres tests/test_postgres_migrations.py

      - name: Check Alembic migration drift
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/intel4ops_ci_test
        run: python -m alembic check

      - name: Generate Alembic offline SQL
        run: python -m alembic upgrade head --sql > "${RUNNER_TEMP}/alembic-upgrade.sql"
